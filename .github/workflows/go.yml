name: Go

on:
  push:
    branches: [ "main" ]  
  pull_request:
    types: [opened, synchronize, reopened]    

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

    - name: Build
      run: go build -o blitzctl -v ./cmd/app

    - name: Test
      run: go test -v ./...
